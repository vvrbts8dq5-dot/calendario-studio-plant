<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>not spannometrica</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='28' fill='%23E86A2D'/%3E%3Crect x='22' y='50' width='76' height='20' rx='10' fill='none' stroke='%23141414' stroke-width='4.5'/%3E%3Ccircle cx='60' cy='60' r='6' fill='%23141414'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="xlsx-style.min.js?v=11" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js" defer></script>
<style>
:root{
  --ink:#141414;--ink2:#3A3A3A;--ink3:#6B6B6B;--ink4:#A6A6A6;
  --paper:#F8F7F6;--paper2:#F1EFED;--white:#FFF;--border:#E3E1DE;
  --steel:#A6A6A6;
  --cantiere:#E86A2D;--cantiere-dark:#C0551F;--cantiere-light:#FBE4D6;
  --verde:#3FAE7A;--verde-light:#E1F5EC;
  --rosso:#DC2626;--rosso-light:#FDECEC;
  --amber:#F59E0B;--amber-light:#FEF3E2;
  --sidebar-w:240px;
  --r-sm:14px;--r-md:20px;--r-lg:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;font-family:'Inter',sans-serif}
input,select,textarea{font-family:'Inter',sans-serif}

/* MARK + WORDMARK ("not spannometrica") */
.mark{color:#fff;flex-shrink:0;display:block}
.wordmark{font-family:'Bricolage Grotesque',sans-serif;white-space:nowrap}
.wordmark .wm-not{color:var(--cantiere);font-weight:700}
.wordmark .wm-spanno{color:#fff;font-weight:600}
.wordmark-lockup{display:flex;align-items:center;gap:10px}
.brand-hero{display:flex;flex-direction:column;align-items:center;gap:16px;color:#fff;margin-bottom:8px}
.brand-hero .wordmark{font-size:26px}
.brand-hero .tagline{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink4)}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:20px}
.login-wrap{display:flex;flex-direction:column;align-items:center;gap:30px;width:100%;max-width:380px}
.login-box{background:var(--white);border-radius:var(--r-lg);padding:40px 44px;width:100%}
.login-title{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700;color:var(--ink);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--ink4);margin-bottom:28px}
.f-label{font-size:12px;font-weight:500;color:var(--ink3);display:block;margin-bottom:5px}
.f-input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:14px;background:var(--paper);color:var(--ink);outline:none;transition:border .15s;margin-bottom:14px}
.f-input:focus{border-color:var(--cantiere);background:var(--white)}
.login-btn{width:100%;padding:12px;background:var(--ink);color:#fff;border-radius:var(--r-sm);font-size:14px;font-weight:500;margin-top:4px;transition:background .15s}
.login-btn:hover{background:var(--ink2)}
.login-error{font-size:12px;color:var(--rosso);background:var(--rosso-light);padding:8px 12px;border-radius:10px;display:none;margin-bottom:12px}

/* SCHERMATA DISCIPLINA */
#disciplina-screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;background:var(--ink);padding:20px}
.disciplina-card{background:var(--white);border-radius:var(--r-lg);padding:44px 40px;max-width:480px;width:100%;text-align:center}
.disciplina-title{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;margin-bottom:6px}
.disciplina-sub{font-size:13px;color:var(--ink4);margin-bottom:30px}
.disciplina-scelte{display:flex;gap:14px;flex-wrap:wrap}
.disciplina-btn{flex:1;min-width:170px;padding:30px 16px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--paper);cursor:pointer;transition:all .15s;text-align:center}
.disciplina-btn:hover{border-color:var(--cantiere);background:var(--cantiere-light)}
.disciplina-btn .nome{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:700;color:var(--ink);display:block}
.disciplina-btn .sub{font-size:12px;color:var(--ink4);display:block;margin-top:4px}

/* APP SHELL */
#app{display:none;height:100vh;overflow:hidden;position:relative}
#app.visible{display:flex}
/* Sidebar comprimibile: quando si apre un progetto la nascondiamo per dare
   più spazio orizzontale allo schermo diviso (utile soprattutto per non
   tagliare il bottone "+ Aggiungi" nel pannello destro). La freccia
   fluttuante in alto a sinistra la fa ricomparire in qualsiasi momento. */
#app.sidebar-nascosta .sidebar{display:none}
.sidebar-toggle-btn{position:fixed;top:14px;left:14px;z-index:50;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:none;align-items:center;justify-content:center;font-size:15px;border:1px solid #2a2a2a;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.sidebar-toggle-btn:hover{background:var(--ink2)}
#app.sidebar-nascosta .sidebar-toggle-btn{display:flex}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--ink);display:flex;flex-direction:column;height:100vh;overflow-y:auto;flex-shrink:0}
.sidebar-logo{padding:22px 20px 16px;border-bottom:1px solid #222}
.disciplina-badge{display:inline-flex;align-items:center;gap:4px;margin-top:12px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--ink4);border:1px solid #2a2a2a;background:#1a1a1a}
.sidebar-section{padding:14px 12px 6px}
.sidebar-divider{height:1px;background:#232323;margin:8px 16px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;color:#888;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:#1a1a1a;color:#ccc}
.nav-item.active{background:var(--cantiere);color:#fff}
.sidebar-footer{padding:14px 20px;border-top:1px solid #1e1e1e;margin-top:auto}
.user-name{font-size:13px;font-weight:500;color:#ccc}
.footer-links{display:flex;gap:10px;margin-top:6px}
.logout-btn,.cambia-disciplina-btn{font-size:11px;color:#555;cursor:pointer;border:none;background:none;padding:0;transition:color .15s}
.logout-btn:hover{color:var(--rosso)}
.cambia-disciplina-btn:hover{color:var(--cantiere)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:52px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0}
.topbar-title{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:700;flex:1}
.content{flex:1;overflow-y:auto;padding:24px;background:var(--paper);display:flex;flex-direction:column;min-height:0}
.page{display:none;flex-direction:column;min-height:0;flex:1}
.page.active{display:flex}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--r-sm);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--ink2);transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--paper2)}
.btn-ink{background:var(--ink);color:#fff;border-color:var(--ink2)}
.btn-ink:hover{background:var(--ink2)}
.btn-blu{background:var(--cantiere);color:#fff;border-color:var(--cantiere-dark)}
.btn-blu:hover{background:var(--cantiere-dark)}
.btn-verde{background:var(--verde);color:#fff;border-color:#2c7d5a}
.btn-rosso{background:var(--rosso);color:#fff;border-color:#a01e1e}
.btn-sm{padding:6px 11px;font-size:11px}

/* LAYOUT COMUNI */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-md);padding:20px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px;flex-shrink:0}
.page-title{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700}
.empty-state{text-align:center;padding:32px;color:var(--ink4);font-size:13px}
.f-input-inline{padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px}
.alert-box{padding:10px 14px;border-radius:12px;font-size:12px;margin-bottom:12px}
.alert-ok{background:var(--verde-light);color:var(--verde)}
.alert-err{background:var(--rosso-light);color:var(--rosso)}

/* VISTA AD ALBERO (Computo + Prezzari) — flex-shrink:0 è essenziale: dentro
   .page (ora un flex a colonna, introdotto per lo schermo diviso dei
   Progetti), senza questa regola il flexbox comprime .albero-wrap
   nell'altezza disponibile invece di lasciargli la sua altezza naturale,
   e con overflow:hidden le righe in eccedenza vengono tagliate via senza
   possibilità di scorrimento. Con flex-shrink:0 l'elemento torna a
   crescere liberamente con il contenuto, e lo scorrimento della pagina
   (gestito da .content) torna a funzionare come prima. */
.albero-wrap{background:var(--white);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;flex-shrink:0}
.albero-header{display:grid;gap:10px;padding:9px 14px;background:var(--paper2);font-weight:600;color:var(--ink2);font-size:10px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
.albero-riga{display:grid;align-items:start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px}
.albero-riga:last-child{border-bottom:none}
/* Colonne: Numero | Titolo/Descrizione | Misure | U.M. | Azioni — la
   vecchia colonna "Cod. E.P." è stata rimossa (bug 3: superata dal
   numero gerarchico in grassetto, che ora è l'unico identificativo). */
.albero-riga-computo{grid-template-columns:92px 1fr 140px 60px 96px}
.albero-riga-prezzario{grid-template-columns:92px 100px 1fr 60px 100px 96px}
.albero-capitolo{cursor:pointer;background:var(--paper2)}
.albero-capitolo:hover{background:var(--border)}
.albero-titolo-capitolo{grid-column:2/-2;font-family:'Bricolage Grotesque',sans-serif;font-weight:700}
.albero-numero{font-family:'JetBrains Mono',monospace;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.albero-freccia{display:inline-block;width:12px;color:var(--ink4);font-size:9px}
.albero-voce-titolo{font-weight:600}
.albero-desc-sub{font-size:11px;color:var(--ink4);margin-top:2px}
.albero-azioni{grid-column:-2/-1;text-align:right;white-space:nowrap}
.td-r{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:500;font-variant-numeric:tabular-nums}

/* PROGETTI — lista */
.progetto-riga{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--white);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 16px;margin-bottom:8px}
.progetto-riga-nome{font-weight:600;font-size:13px;cursor:pointer;flex:1}
.progetto-riga-azioni{display:flex;gap:8px;flex-shrink:0}
.form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.form-row input{padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px}

/* PROGETTI — schermo diviso: ogni pannello scorre per conto proprio.
   L'altezza di .split-screen viene fissata via JS (vedi progetti_module.js,
   funzione _fissaAltezzaSplitScreen) in base allo spazio verticale
   realmente disponibile, così sinistra e destra hanno ciascuno la propria
   barra di scorrimento indipendente e non si trascinano a vicenda. */
.split-screen{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:stretch;overflow:hidden;flex:1;min-height:0}
@media (max-width:980px){.split-screen{grid-template-columns:1fr;height:auto !important;overflow:visible;flex:none}}
.split-pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.split-pane-titolo{font-family:'Bricolage Grotesque',sans-serif;font-size:13px;font-weight:700;margin-bottom:10px;color:var(--ink2);flex-shrink:0}
.fonte-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;flex-shrink:0}
.fonte-tab{padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:var(--white);font-size:11px;font-weight:600;cursor:pointer;color:var(--ink3)}
.fonte-tab.active{background:var(--cantiere);border-color:var(--cantiere-dark);color:#fff}
.split-pane .toolbar{flex-shrink:0}
.split-pane-scroll{flex:1;min-height:0;overflow-y:auto}
.albero-riga-progetto{grid-template-columns:78px 90px 1fr 60px 90px 90px 90px 44px}
.qty-input{width:100%;padding:4px 6px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:'JetBrains Mono',monospace}
.edit-input{width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:'Inter',sans-serif;background:var(--paper)}
.edit-textarea{width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:'Inter',sans-serif;background:var(--paper);resize:vertical;min-height:34px}
.totale-progetto{text-align:right;font-size:13px;padding:12px 4px;color:var(--ink2)}
.fonte-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.03em}
.fonte-badge-computo{background:var(--amber-light);color:var(--amber)}
.fonte-badge-dei{background:var(--verde-light);color:var(--verde)}
.fonte-badge-veneto{background:var(--cantiere-light);color:var(--cantiere-dark)}
.fonte-badge-manuale{background:var(--paper2);color:var(--ink3)}

/* IMPORT BANNER */
.import-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--cantiere-light);border:1px solid var(--cantiere);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:16px;font-size:12px;flex-wrap:wrap;flex-shrink:0}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;flex-shrink:0}
.toolbar input[type=search]{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px}

/* MODALE DI SCELTA (sostituisce i doppi confirm() ambigui) */
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,20,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:26px;max-width:420px;width:100%}
.modal-titolo{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:700;margin-bottom:8px}
.modal-corpo{font-size:13px;color:var(--ink3);margin-bottom:20px;white-space:pre-line;line-height:1.5}
.modal-azioni{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="brand-hero">
      <svg class="mark" viewBox="0 0 120 120" width="72" height="72" aria-hidden="true">
        <rect x="22" y="50" width="76" height="20" rx="10" fill="none" stroke="currentColor" stroke-width="4.5"/>
        <circle cx="60" cy="60" r="6" fill="currentColor"/>
      </svg>
      <div class="wordmark"><span class="wm-not">not</span><span class="wm-spanno">spannometrica</span></div>
      <div class="tagline">The new shape of precision</div>
    </div>
    <div class="login-box">
      <div class="login-title">Accedi</div>
      <div class="login-sub">Computo · Prezzario Veneto · Prezzario DEI</div>
      <div class="login-error" id="login-error"></div>
      <label class="f-label">Email</label>
      <input class="f-input" id="inp-user" type="email" autocomplete="username">
      <label class="f-label">Password</label>
      <input class="f-input" id="inp-pass" type="password" autocomplete="current-password">
      <button class="login-btn" id="btn-login">Accedi</button>
    </div>
  </div>
</div>

<!-- SCELTA DISCIPLINA -->
<div id="disciplina-screen">
  <div class="brand-hero" style="margin-bottom:24px">
    <svg class="mark" viewBox="0 0 120 120" width="48" height="48" aria-hidden="true">
      <rect x="22" y="50" width="76" height="20" rx="10" fill="none" stroke="currentColor" stroke-width="4.5"/>
      <circle cx="60" cy="60" r="6" fill="currentColor"/>
    </svg>
    <div class="wordmark" style="font-size:19px"><span class="wm-not">not</span><span class="wm-spanno">spannometrica</span></div>
  </div>
  <div class="disciplina-card">
    <div class="disciplina-title">Scegli la disciplina</div>
    <div class="disciplina-sub">Computo e prezzari sono separati per disciplina — nessun dato in comune</div>
    <div class="disciplina-scelte">
      <button class="disciplina-btn" data-disciplina="elettrico">
        <span class="nome">Elettrico</span><span class="sub">Impianti elettrici</span>
      </button>
      <button class="disciplina-btn" data-disciplina="meccanico">
        <span class="nome">Meccanico</span><span class="sub">Impianti meccanici</span>
      </button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <button class="sidebar-toggle-btn" id="btn-mostra-sidebar" title="Mostra il menu" onclick="mostraSidebar()">→</button>
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="wordmark-lockup">
        <svg class="mark" viewBox="0 0 120 120" width="26" height="26" aria-hidden="true">
          <rect x="22" y="50" width="76" height="20" rx="10" fill="none" stroke="currentColor" stroke-width="4.5"/>
          <circle cx="60" cy="60" r="6" fill="currentColor"/>
        </svg>
        <span class="wordmark" style="font-size:16px"><span class="wm-not">not</span><span class="wm-spanno">spannometrica</span></span>
      </div>
      <div class="disciplina-badge" id="disciplina-badge"></div>
    </div>
    <div class="sidebar-section">
      <button class="nav-item active" data-page="progetti">Progetti</button>
      <div class="sidebar-divider"></div>
      <button class="nav-item" data-page="computo">Computo</button>
      <button class="nav-item" data-page="veneto">Prezzario Veneto</button>
      <button class="nav-item" data-page="dei">Prezzario DEI</button>
    </div>
    <div class="sidebar-footer">
      <div class="user-name" id="user-email">—</div>
      <div class="footer-links">
        <button class="cambia-disciplina-btn" id="btn-cambia-disciplina">Cambia disciplina</button>
        <button class="logout-btn" id="btn-logout">Esci</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Progetti</div>
    </div>
    <div class="content">

      <div class="page" id="page-computo"></div>
      <div class="page active" id="page-progetti"></div>
      <div class="page" id="page-veneto"></div>
      <div class="page" id="page-dei"></div>

    </div>
  </div>
</div>

<script src="tree_view.js?v=12" defer></script>
<script src="computo_module.js?v=12" defer></script>
<script src="import_computo.js?v=12" defer></script>
<script src="prezzario_module.js?v=12" defer></script>
<script src="import_prezzario.js?v=11" defer></script>
<script src="progetti_module.js?v=11" defer></script>
<script src="app_init.js?v=11" defer></script>
</body>
</html>
